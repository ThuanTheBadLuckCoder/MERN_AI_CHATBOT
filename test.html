<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Theme Hero Section</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media (max-width: 768px) {
            .hero-content {
                flex-direction: column-reverse;
            }

            .hero-img {
                margin: 0 auto;
                max-width: 80%;
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-white">
    <div class="flex flex-col lg:flex-row items-center justify-between px-4 py-16 mx-auto lg:py-32 xl:py-48 md:px-8 sm:max-w-xl md:max-w-full">
        <div class="max-w-lg lg:w-1/2">
            <h2 class="text-4xl font-bold text-purple-400 mb-4">We will bring your business <span class="text-white">online</span></h2>
            <p class="text-base text-gray-300 md:text-lg mb-6">
                Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae. explicabo.
            </p>
            <form>
                <div class="flex flex-col md:flex-row mb-4">
                    <input placeholder="Name" required type="text" class="input-field" />
                    <input placeholder="Email" required type="email" class="input-field" />
                </div>
                <div class="flex items-center">
                    <button type="submit" class="btn">Subscribe</button>
                    <a href="/" class="text-purple-400 ml-4">Learn more</a>
                </div>
            </form>
        </div>
        <div class="max-w-xl lg:w-1/2 lg:ml-10 lg:mr-0">
            <img src="https://kitwind.io/assets/kometa/laptop.png" class="hero-img" alt="Laptop Image" />
        </div>
    </div>
    <style>
        .input-field {
            padding: 0.75rem;
            margin-bottom: 1rem;
            width: 100%;
            border: 1px solid #6b7280;
            border-radius: 0.5rem;
            background-color: #1f2937;
            color: white;
            transition: border-color 0.3s;
        }
        
        .input-field::placeholder {
            color: #9CA3AF;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #8B5CF6;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            background-color: #A855F7;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn:hover,
        .btn:focus {
            background-color: #9F7AEA;
        }
    </style>
</body>

</html>
